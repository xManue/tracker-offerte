[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-tracker-offerte"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy>=2.0,<3",
    "tzdata",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dataset = ["pyarrow>=17"]
documents = ["openpyxl>=3.1", "pypdf>=5", "pypdfium2>=4", "pillow>=10", "imagehash>=4", "pytesseract>=0.3"]
test = ["pytest>=8"]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.package-data]
tracker = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
