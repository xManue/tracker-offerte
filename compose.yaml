services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker-local
      POSTGRES_DB: tracker
    volumes:
      - tracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker-local@db/tracker
    command: ["sh", "-c", "alembic upgrade head && tracker bootstrap"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker-local@db/tracker
    command: ["uvicorn", "tracker.web:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker-local@db/tracker
    command: ["tracker", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  tools:
    profiles: ["tools"]
    build: .
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker-local@db/tracker
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  tracker-db:
